name: Manual Build - Selectable VieNeu Version

# Manual-only workflow. The automatic publish workflow (docker-publish.yml)
# keeps building whatever version requirements.txt declares; this workflow
# bakes an explicitly selected vieneu version into a separate image tag so
# multiple model generations can run side by side.
on:
  workflow_dispatch:
    inputs:
      vieneu_version:
        description: "VieNeu package version baked into the image (3.7.1+)"
        required: true
        type: choice
        default: "3.8.3"
        options:
          - "3.7.1"
          - "3.8.0"
          - "3.8.1"
          - "3.8.2"
          - "3.8.3"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push (vieneu-${{ inputs.vieneu_version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU for multi-architecture builds (AMD64 & ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate image name and tags
        id: vars
        run: |
          IMAGE=$(echo "${{ github.repository_owner }}/vienuetts_server" | tr '[:upper:]' '[:lower:]')
          COUNT=$(git rev-list --count HEAD)
          VERSION="${{ inputs.vieneu_version }}"
          {
            echo "image=${IMAGE}"
            echo "count=${COUNT}"
            echo "version=${VERSION}"
            echo "tags<<EOF"
            echo "${REGISTRY}/${IMAGE}:vieneu-${VERSION}"
            echo "${REGISTRY}/${IMAGE}:vieneu-${VERSION}-v${COUNT}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VIENEU_VERSION=${{ steps.vars.outputs.version }}
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.version=v${{ steps.vars.outputs.count }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=vieneu-${{ steps.vars.outputs.version }}
          cache-to: type=gha,mode=max,scope=vieneu-${{ steps.vars.outputs.version }}

      - name: Write job summary
        run: |
          {
            echo "## Image published"
            echo ""
            echo "- **vieneu version:** \`${{ steps.vars.outputs.version }}\`"
            echo "- **Tags:**"
            echo '```'
            echo "${REGISTRY}/${{ steps.vars.outputs.image }}:vieneu-${{ steps.vars.outputs.version }}"
            echo "${REGISTRY}/${{ steps.vars.outputs.image }}:vieneu-${{ steps.vars.outputs.version }}-v${{ steps.vars.outputs.count }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
